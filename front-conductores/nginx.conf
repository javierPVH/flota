# nginx del contenedor front-conductores: puerta COMPLETA del dominio público.
# Sirve el SPA y reenvía la API (/api) al back por la red interna del compose.
# NO expone /admin (el panel de administración no sale a internet).

map $http_x_forwarded_proto $flota_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

upstream flota_back { server back:8000; }

server {
    listen 80;
    server_name _;                    # este puerto sirve SOLO conductores
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 20m;         # subida de documentos desde el móvil

    # --- API de Django -> back (sin /admin) ---
    location /api/ {
        proxy_pass http://flota_back;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $flota_proto;
        proxy_set_header X-Forwarded-Host  $host;
    }

    # --- Media (documentos). Ver aviso RGPD en el README de despliegue. ---
    location /media/ { alias /data/media/; }

    # --- SPA ---
    location / {
        try_files $uri $uri/ /index.html;
    }
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }
}
