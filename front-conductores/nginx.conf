# nginx del contenedor front-conductores: puerta COMPLETA del dominio público.
# Sirve el SPA y reenvía la API (/api) al back por la red interna del compose.
# NO expone /admin (el panel de administración no sale a internet).
#
# AUTH-5 / CFG-13 / FE-6: este nginx está SIEMPRE detrás del Cloudflare Tunnel
# (cloudflared en red host -> 127.0.0.1:8092), que termina el TLS: el esquema
# real del cliente es https sin excepción. Antes se tomaba X-Forwarded-Proto
# del cliente (`map $http_x_forwarded_proto`), y con el puerto publicado en
# 0.0.0.0 cualquiera de la LAN podía mandar `X-Forwarded-Proto: https` por http
# y hacer pasar por segura una conexión que no lo era. Ahora se fija a https.

upstream flota_back { server back:8000; }

server {
    listen 80;
    server_name _;                    # este puerto sirve SOLO conductores
    root /usr/share/nginx/html;
    index index.html;

    # CFG-10: sin la versión de nginx en `Server:` ni en las páginas de error.
    server_tokens off;

    # OPS6: alineado con FLEET_DOCUMENT_MAX_MB (10 MB) + margen multipart.
    client_max_body_size 12m;

    # SEC10: cabeceras de seguridad (SPA pública en internet).
    # SRV-5: HSTS tiene UNA sola fuente, este nginx (Django va con
    # SECURE_HSTS_SECONDS=0 en producción; ver back/.env.prod.example).
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(self)" always;
    # A3: CSP — la PWA no carga NADA externo (sin CDNs ni terceros); el
    # R5-53: accounts.google.com/gsi solo para el login con Google (GoogleLoginPage, SOLO_GOOGLE).
    # wallpaper va como data: URI en el CSS y el SW/manifest son same-origin.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://accounts.google.com/gsi/client; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' https://accounts.google.com/gsi/; worker-src 'self'; manifest-src 'self'; frame-src https://accounts.google.com/gsi/; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # --- API de Django -> back (sin /admin) ---
    location /api/ {
        proxy_pass http://flota_back;
        proxy_set_header Host              $host;
        # $remote_addr aquí es cloudflared (el gateway del bridge); la IP real
        # del cliente viaja en X-Forwarded-For (cloudflared la pone y nginx se
        # añade detrás: TRUSTED_PROXY_COUNT=2 en el back) y en CF-Connecting-IP,
        # que se reenvía tal cual llega.
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header CF-Connecting-IP  $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host  $host;
        # CFG-10: Django también manda estas cuatro; con el `add_header ... always`
        # del server llegaban duplicadas. Las de nginx son la única fuente.
        proxy_hide_header X-Frame-Options;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header Strict-Transport-Security;
    }

    # --- Media (documentos con datos personales) — SEC3/RGPD ---
    # nginx ya NO sirve /media directamente: la petición pasa por Django, que
    # exige sesión y responde X-Accel-Redirect a la location internal.
    location /media/ {
        proxy_pass http://flota_back;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header CF-Connecting-IP  $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header Strict-Transport-Security;
    }
    location /_protected_media/ {
        internal;                      # solo alcanzable vía X-Accel-Redirect
        alias /data/media/;
    }

    # --- SPA ---
    # BG5: el service worker y el shell NUNCA se cachean en cliente/proxy —
    # si no, los deploys no llegan (SW viejo sirviendo assets purgados).
    location = /sw.js {
        add_header Cache-Control "no-cache";
        # A3: un add_header dentro de una location CANCELA los heredados del
        # server — hay que repetir aquí las cabeceras de seguridad.
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=(self)" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://accounts.google.com/gsi/client; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' https://accounts.google.com/gsi/; worker-src 'self'; manifest-src 'self'; frame-src https://accounts.google.com/gsi/; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        try_files $uri =404;
    }
    location = /index.html {
        add_header Cache-Control "no-cache";
        # A3: un add_header dentro de una location CANCELA los heredados del
        # server — hay que repetir aquí las cabeceras de seguridad.
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=(self)" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://accounts.google.com/gsi/client; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' https://accounts.google.com/gsi/; worker-src 'self'; manifest-src 'self'; frame-src https://accounts.google.com/gsi/; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    }
    location / {
        add_header Cache-Control "no-cache";
        # A3: un add_header dentro de una location CANCELA los heredados del
        # server — hay que repetir aquí las cabeceras de seguridad.
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=(self)" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://accounts.google.com/gsi/client; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' https://accounts.google.com/gsi/; worker-src 'self'; manifest-src 'self'; frame-src https://accounts.google.com/gsi/; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        try_files $uri $uri/ /index.html;
    }
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        # A3: un add_header dentro de una location CANCELA los heredados del
        # server — hay que repetir aquí las cabeceras de seguridad.
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=(self)" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://accounts.google.com/gsi/client; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' https://accounts.google.com/gsi/; worker-src 'self'; manifest-src 'self'; frame-src https://accounts.google.com/gsi/; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        try_files $uri =404;
    }

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        # A3: un add_header dentro de una location CANCELA los heredados del
        # server — hay que repetir aquí las cabeceras de seguridad.
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=(self)" always;
        return 200 "ok\n";
    }
}
