# nginx del contenedor front-conductores: puerta COMPLETA del dominio público.
# Sirve el SPA y reenvía la API (/api) al back por la red interna del compose.
# NO expone /admin (el panel de administración no sale a internet).

map $http_x_forwarded_proto $flota_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

upstream flota_back { server back:8000; }

server {
    listen 80;
    server_name _;                    # este puerto sirve SOLO conductores
    root /usr/share/nginx/html;
    index index.html;

    # OPS6: alineado con FLEET_DOCUMENT_MAX_MB (10 MB) + margen multipart.
    client_max_body_size 12m;

    # SEC10: cabeceras de seguridad (SPA pública en internet).
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    # A3: CSP — la PWA no carga NADA externo (sin CDNs ni terceros); el
    # wallpaper va como data: URI en el CSS y el SW/manifest son same-origin.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; worker-src 'self'; manifest-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # --- API de Django -> back (sin /admin) ---
    location /api/ {
        proxy_pass http://flota_back;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $flota_proto;
        proxy_set_header X-Forwarded-Host  $host;
    }

    # --- Media (documentos con datos personales) — SEC3/RGPD ---
    # nginx ya NO sirve /media directamente: la petición pasa por Django, que
    # exige sesión y responde X-Accel-Redirect a la location internal.
    location /media/ {
        proxy_pass http://flota_back;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $flota_proto;
        proxy_set_header X-Forwarded-Host  $host;
    }
    location /_protected_media/ {
        internal;                      # solo alcanzable vía X-Accel-Redirect
        alias /data/media/;
    }

    # --- SPA ---
    # BG5: el service worker y el shell NUNCA se cachean en cliente/proxy —
    # si no, los deploys no llegan (SW viejo sirviendo assets purgados).
    location = /sw.js {
        add_header Cache-Control "no-cache";
        # A3: un add_header dentro de una location CANCELA los heredados del
        # server — hay que repetir aquí las cabeceras de seguridad.
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; worker-src 'self'; manifest-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        try_files $uri =404;
    }
    location = /index.html {
        add_header Cache-Control "no-cache";
        # A3: un add_header dentro de una location CANCELA los heredados del
        # server — hay que repetir aquí las cabeceras de seguridad.
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; worker-src 'self'; manifest-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    }
    location / {
        add_header Cache-Control "no-cache";
        # A3: un add_header dentro de una location CANCELA los heredados del
        # server — hay que repetir aquí las cabeceras de seguridad.
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; worker-src 'self'; manifest-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        try_files $uri $uri/ /index.html;
    }
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        # A3: un add_header dentro de una location CANCELA los heredados del
        # server — hay que repetir aquí las cabeceras de seguridad.
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; worker-src 'self'; manifest-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        try_files $uri =404;
    }

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        # A3: un add_header dentro de una location CANCELA los heredados del
        # server — hay que repetir aquí las cabeceras de seguridad.
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        return 200 "ok\n";
    }
}
