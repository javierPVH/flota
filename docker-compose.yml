# Despliegue de PRODUCCIÓN de Flota en srvgcptd (Docker + Cloudflare Tunnel).
#
#   db                  -> PostgreSQL propio de Flota.   SOLO red interna (aislado).
#   back                -> Django + DRF (gunicorn).      SOLO red interna.
#   front-gestion       -> nginx: SPA + proxy /api,/admin -> back.
#   front-conductores   -> nginx: SPA + proxy /api      -> back.
#
# Cada front es una PUERTA completa de su dominio, publicada en loopback:
#   · conductores -> 127.0.0.1:8092   (se cuelga del Cloudflare Tunnel = internet)
#   · gestion     -> 127.0.0.1:8093   (SOLO interna/VPN, NUNCA en el túnel)
#
# LAS DOS APLICACIONES SE LEVANTAN SIEMPRE: ningún servicio usa `profiles`, así
# que un `up` normal arranca back + gestión + conductores. (Antes iban detrás de
# los perfiles `gestion`/`conductores` y bastaba olvidar COMPOSE_PROFILES —o usar
# `--profile gestion`— para quedarse sin el front de conductores.)
#
# La BD y sus credenciales viven en el `.env` de infra (DB_NAME/DB_USER/DB_PASSWORD):
# las usan tanto `db` (POSTGRES_*) como `back` (DB_*), así no se duplican.
#
#   docker compose up -d --build                 # todo: back + los dos fronts
#
# Para levantar SOLO una de las dos apps, nombra sus servicios explícitamente
# (compose arrastra sus dependencias; añade `jobs` para las tareas programadas):
#
#   docker compose up -d --build back jobs front-conductores
#   docker compose up -d --build back jobs front-gestion

name: flota

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-flota}
      POSTGRES_USER: ${DB_USER:-flota}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD en .env (sin el símbolo $)}
    volumes:
      - flota_pgdata:/var/lib/postgresql/data
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-flota} -d ${DB_NAME:-flota}"]
      interval: 10s
      timeout: 5s
      retries: 5
    # Sin `ports`: aislada, solo accesible por la red interna del compose.

  # SEC7: sin Redis los throttles son LocMem POR WORKER (umbral ×3 y reset en
  # cada deploy). Servicio mínimo, solo red interna.
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    logging: &logrotate
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  back:
    build:
      context: ./back
      dockerfile: Dockerfile
    image: flota-back:${IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    logging: *logrotate
    env_file:
      - ./back/.env.prod
    environment:
      # SEC7: throttles/rate-limit compartidos entre workers.
      REDIS_URL: redis://redis:6379/0
      # BD (fuente única: el .env de infra). Sobreescribe lo que hubiera en el env_file.
      DB_ENGINE: postgres
      DB_NAME: ${DB_NAME:-flota}
      DB_USER: ${DB_USER:-flota}
      DB_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD en .env (sin el símbolo $)}
      DB_HOST: db
      DB_PORT: "5432"
      # Media y estáticos siguen en el volumen ./data.
      DJANGO_MEDIA_ROOT: /app/data/media
      DJANGO_STATIC_ROOT: /app/data/staticfiles
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-3}
    volumes:
      - ${DATA_DIR:-./data}:/app/data
    expose:
      - "8000"

  # OPS1: los trabajos programados (alertas ITV/seguro/km, archivado en Drive,
  # Jira) corren DENTRO del despliegue — sin este servicio no se ejecutan nunca.
  # Reutiliza la imagen del back con un bucle idempotente (ver jobs-loop.sh).
  jobs:
    image: flota-back:${IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      back:
        # OPS4: espera al back SANO (migraciones aplicadas), no solo arrancado.
        condition: service_healthy
    logging: *logrotate
    env_file:
      - ./back/.env.prod
    environment:
      DB_ENGINE: postgres
      DB_NAME: ${DB_NAME:-flota}
      DB_USER: ${DB_USER:-flota}
      DB_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD en .env (sin el símbolo $)}
      DB_HOST: db
      DB_PORT: "5432"
      DJANGO_MEDIA_ROOT: /app/data/media
      DJANGO_STATIC_ROOT: /app/data/staticfiles
      REDIS_URL: redis://redis:6379/0
      FLEET_JOBS_INTERVAL: ${FLEET_JOBS_INTERVAL:-900}
    volumes:
      - ${DATA_DIR:-./data}:/app/data
    entrypoint: ["sh", "deploy/jobs-loop.sh"]
    healthcheck:
      # El healthcheck de la imagen apunta a gunicorn, que aquí no corre.
      disable: true

  front-gestion:
    build:
      context: .
      dockerfile: front-gestion/Dockerfile
    image: flota-front-gestion:${IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      back:
        # OPS4: sin esto el front daba 502 mientras el back migraba.
        condition: service_healthy
    logging: *logrotate
    volumes:
      - ${DATA_DIR:-./data}:/data:ro
    ports:
      # SOLO interna/VPN. Para acceso desde la VPN cambia GESTION_BIND a la IP
      # interna del servidor (p. ej. 10.3.4.6) o a 0.0.0.0; 127.0.0.1 = solo local.
      - "${GESTION_BIND:-127.0.0.1}:${GESTION_PORT:-8093}:80"

  front-conductores:
    build:
      context: .
      dockerfile: front-conductores/Dockerfile
    image: flota-front-conductores:${IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      back:
        condition: service_healthy
    logging: *logrotate
    volumes:
      - ${DATA_DIR:-./data}:/data:ro
    ports:
      # OJO: el Cloudflare Tunnel entra por http://localhost:8092, así que el
      # bind DEBE seguir cubriendo el loopback. Docker publica en UNA sola
      # dirección, no en varias a la vez:
      #   127.0.0.1 -> solo el propio servidor (túnel sí, VPN no).   [por defecto]
      #   0.0.0.0   -> todas las interfaces: el túnel SIGUE bien y además llega la VPN.
      #   10.3.4.6  -> solo la VPN, y entonces el loopback DEJA de publicarse:
      #                habría que repuntar cloudflared a http://10.3.4.6:8092.
      - "${CONDUCTORES_BIND:-127.0.0.1}:${CONDUCTORES_PORT:-8092}:80"

volumes:
  flota_pgdata:
