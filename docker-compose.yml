# Despliegue de PRODUCCIÓN de Flota en srvgcptd (Docker + Cloudflare Tunnel).
#
#   db                  -> PostgreSQL propio de Flota.   SOLO red interna (aislado).
#   back                -> Django + DRF (gunicorn).      SOLO red interna.
#   front-gestion       -> nginx: SPA + proxy /api,/admin -> back.
#   front-conductores   -> nginx: SPA + proxy /api      -> back.
#   backup              -> pg_dump de la BD + tar de la media, diario, con
#                          retención y healthcheck. Destino: BACKUP_HOST_DIR.
#
# Cada front es una PUERTA completa de su dominio, publicada en loopback:
#   · conductores -> 127.0.0.1:8092   (se cuelga del Cloudflare Tunnel = internet)
#   · gestion     -> 127.0.0.1:8093   (SOLO interna/VPN, NUNCA en el túnel)
#
# LAS DOS APLICACIONES SE LEVANTAN SIEMPRE: ningún servicio usa `profiles`, así
# que un `up` normal arranca back + gestión + conductores. (Antes iban detrás de
# los perfiles `gestion`/`conductores` y bastaba olvidar COMPOSE_PROFILES —o usar
# `--profile gestion`— para quedarse sin el front de conductores.)
#
# La BD y sus credenciales viven en el `.env` de infra (DB_NAME/DB_USER/DB_PASSWORD):
# las usan tanto `db` (POSTGRES_*) como `back` (DB_*), así no se duplican.
#
#   docker compose up -d --build                 # todo: back + los dos fronts
#
# Para levantar SOLO una de las dos apps, nombra sus servicios explícitamente
# (compose arrastra sus dependencias; añade `jobs` para las tareas programadas):
#
#   docker compose up -d --build back jobs front-conductores
#   docker compose up -d --build back jobs front-gestion
#
# CFG-5 (auditoría de ciberseguridad, sep-2026): DOS redes en vez de una plana.
#   · frontend -> los dos nginx y el back: es lo único que un nginx alcanza.
#   · backend  -> back, jobs, db, redis y backup: la BD y Redis NO son visibles
#                 desde los contenedores expuestos al exterior.
# El back está en las dos porque es la bisagra. Ninguna es `internal`: back y
# jobs necesitan salir a internet (Google Drive/Gmail, Jira).

name: flota

# --- Defaults reutilizables (auditoría srvgcptd 14-sep-2026) ------------------
# no-new-privileges: un proceso del contenedor no puede ganar privilegios con
# setuid/capabilities aunque lo consiga en local. Ya lo llevaban sap-budget y
# list; flota y gastos no.
x-security: &default-security
  security_opt:
    - no-new-privileges:true

# CFG-8: capacidades mínimas. Docker regala 14 capacidades a cada contenedor;
# aquí se quitan TODAS y se devuelven solo las que cada imagen necesita:
#   · nginx oficial (arranca como root y baja a `nginx` para los workers):
#     CHOWN (cache dirs), SETGID/SETUID (bajar de root) y NET_BIND_SERVICE (:80).
#   · redis oficial (su entrypoint hace chown del /data y su-exec a `redis`):
#     CHOWN, SETGID, SETUID.
#   · back/jobs: gunicorn corre como `appuser` (uid 10001, ver back/Dockerfile),
#     el entrypoint no hace chown y el puerto es el 8000: NINGUNA.
#   · db y backup se quedan como estaban (pendiente, ver deploy/README-DEPLOY.md):
#     el entrypoint de postgres chown-ea PGDATA y el crond de BusyBox necesita
#     setgroups para lanzar cada job; probarlo a ciegas en producción no compensa.
x-caps-none: &caps-none
  cap_drop: [ALL]
x-caps-nginx: &caps-nginx
  cap_drop: [ALL]
  cap_add: [CHOWN, SETGID, SETUID, NET_BIND_SERVICE]
x-caps-redis: &caps-redis
  cap_drop: [ALL]
  cap_add: [CHOWN, SETGID, SETUID]

# Límites de memoria/PIDs: el host no tiene swap y son 15 GiB para ~20
# contenedores de varios proyectos; sin tope, un proceso desbocado se lleva a
# todos por delante. Cifras conservadoras (muy por encima del uso normal):
# antes de bajarlas, mide con `docker stats --no-stream`.
x-limits-db: &limits-db
  resources: { limits: { memory: 1G, pids: 256 } }
x-limits-app: &limits-app
  resources: { limits: { memory: 1536M, pids: 512 } }
x-limits-jobs: &limits-jobs
  resources: { limits: { memory: 768M, pids: 256 } }
x-limits-small: &limits-small
  resources: { limits: { memory: 256M, pids: 128 } }

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    <<: *default-security
    deploy: *limits-db
    environment:
      POSTGRES_DB: ${DB_NAME:-flota}
      POSTGRES_USER: ${DB_USER:-flota}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD en .env (sin el símbolo $)}
    volumes:
      - flota_pgdata:/var/lib/postgresql/data
    networks: [backend]
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-flota} -d ${DB_NAME:-flota}"]
      interval: 10s
      timeout: 5s
      retries: 5
    # Sin `ports`: aislada, solo accesible por la red interna del compose.

  # SEC7: sin Redis los throttles son LocMem POR WORKER (umbral ×3 y reset en
  # cada deploy). Servicio mínimo, solo red interna.
  # CFG-5: con contraseña (REDIS_PASSWORD del .env de infra). El `:?` hace que
  # el compose NO arranque si falta: un Redis sin contraseña en silencio es
  # justo lo que se quiere evitar. Genera una con `openssl rand -hex 32` (solo
  # hex: sin '$' ni caracteres que compose o la URL interpreten).
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    <<: [*default-security, *caps-redis]
    deploy: *limits-small
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?Define REDIS_PASSWORD en .env (openssl rand -hex 32)}"]
    environment:
      # redis-cli lee la contraseña de aquí (así el healthcheck no la pasa con
      # `-a`, que redis-cli avisa como inseguro y deja en el log).
      REDISCLI_AUTH: ${REDIS_PASSWORD:?Define REDIS_PASSWORD en .env (openssl rand -hex 32)}
    networks: [backend]
    healthcheck:
      # Con requirepass, un `ping` sin autenticar responde NOAUTH (y redis-cli
      # puede salir con 0): se exige el PONG literal.
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 5
    logging: &logrotate
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  back:
    build:
      context: ./back
      dockerfile: Dockerfile
    image: flota-back:${IMAGE_TAG:-latest}
    restart: unless-stopped
    <<: [*default-security, *caps-none]
    deploy: *limits-app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    logging: *logrotate
    env_file:
      - ./back/.env.prod
    environment:
      # SEC7: throttles/rate-limit compartidos entre workers. CFG-5: con la
      # contraseña de Redis (sobreescribe cualquier REDIS_URL del env_file).
      REDIS_URL: redis://:${REDIS_PASSWORD:?Define REDIS_PASSWORD en .env (openssl rand -hex 32)}@redis:6379/0
      # BD (fuente única: el .env de infra). Sobreescribe lo que hubiera en el env_file.
      DB_ENGINE: postgres
      DB_NAME: ${DB_NAME:-flota}
      DB_USER: ${DB_USER:-flota}
      DB_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD en .env (sin el símbolo $)}
      DB_HOST: db
      DB_PORT: "5432"
      # Media y estáticos siguen en el volumen ./data.
      DJANGO_MEDIA_ROOT: /app/data/media
      DJANGO_STATIC_ROOT: /app/data/staticfiles
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-3}
    volumes:
      - ${DATA_DIR:-./data}:/app/data
    networks: [frontend, backend]
    expose:
      - "8000"

  # OPS1: los trabajos programados (alertas ITV/seguro/km, archivado en Drive,
  # Jira) corren DENTRO del despliegue — sin este servicio no se ejecutan nunca.
  # Reutiliza la imagen del back con un bucle idempotente (ver jobs-loop.sh).
  jobs:
    image: flota-back:${IMAGE_TAG:-latest}
    restart: unless-stopped
    <<: [*default-security, *caps-none]
    deploy: *limits-jobs
    depends_on:
      db:
        condition: service_healthy
      back:
        # OPS4: espera al back SANO (migraciones aplicadas), no solo arrancado.
        condition: service_healthy
    logging: *logrotate
    env_file:
      - ./back/.env.prod
    environment:
      DB_ENGINE: postgres
      DB_NAME: ${DB_NAME:-flota}
      DB_USER: ${DB_USER:-flota}
      DB_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD en .env (sin el símbolo $)}
      DB_HOST: db
      DB_PORT: "5432"
      DJANGO_MEDIA_ROOT: /app/data/media
      DJANGO_STATIC_ROOT: /app/data/staticfiles
      REDIS_URL: redis://:${REDIS_PASSWORD:?Define REDIS_PASSWORD en .env (openssl rand -hex 32)}@redis:6379/0
      FLEET_JOBS_INTERVAL: ${FLEET_JOBS_INTERVAL:-900}
    volumes:
      - ${DATA_DIR:-./data}:/app/data
    networks: [backend]
    entrypoint: ["sh", "deploy/jobs-loop.sh"]
    healthcheck:
      # El healthcheck de la imagen apunta a gunicorn, que aquí no corre.
      disable: true

  # OPS2: backup diario de la BD (pg_dump, formato custom) y de la media (tar),
  # con retención y healthcheck. Hasta el 15-sep-2026 flota no tenía NINGUNA
  # copia (auditoría srvgcptd): el deploy/backup.sh era un cron del host que
  # nunca llegó a instalarse.
  #
  # Reutiliza la imagen de `db` (postgres:16-alpine): así pg_dump es SIEMPRE la
  # misma versión que el servidor —el postgresql-client de Debian es la 15 y
  # aborta contra un 16, nos pasó en sap-budget— y trae crond, con lo que no hay
  # imagen que construir: los scripts van bind-montados desde deploy/. Corre
  # como root porque crond y el bind del destino lo necesitan.
  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    logging: *logrotate
    <<: *default-security
    deploy: *limits-small
    environment:
      # pg_dump lee las PG* directamente: no hace falta pasarle flags.
      PGHOST: db
      PGPORT: "5432"
      PGDATABASE: ${DB_NAME:-flota}
      PGUSER: ${DB_USER:-flota}
      PGPASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD en .env (sin el símbolo $)}
      PGCONNECT_TIMEOUT: "15"
      BACKUP_DIR: /backups
      BACKUP_MEDIA_DIR: /data/media
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-30}
      BACKUP_CRON: ${BACKUP_CRON:-30 3 * * *}
      # CFG-6: clave PÚBLICA de `age` para cifrar el dump y el tar. Vacía =
      # backup en claro (backup.sh lo avisa en cada pasada). Ver README-DEPLOY.
      BACKUP_AGE_RECIPIENT: ${BACKUP_AGE_RECIPIENT:-}
    volumes:
      # Destino. En el servidor apunta a OTRO disco (/mnt/data): ver .env.example.
      - ${BACKUP_HOST_DIR:-./backups}:/backups
      # La media (documentos subidos) va en el tar, solo lectura. Se monta ./data
      # entero —existe seguro— y no ./data/media: si esa carpeta aún no existiera,
      # Docker la crearía como root y el back (appuser) no podría escribir en ella.
      - ${DATA_DIR:-./data}:/data:ro
      - ./deploy/backup-entrypoint.sh:/deploy/backup-entrypoint.sh:ro
      - ./deploy/backup.sh:/deploy/backup.sh:ro
    networks: [backend]
    entrypoint: []
    command: ["sh", "/deploy/backup-entrypoint.sh"]
    healthcheck:
      # Sano = crond sigue siendo PID 1 Y hay un .last-backup-ok de menos de 26 h
      # (solo lo escribe backup.sh tras verificar el dump). Se lee /proc/1/comm y
      # no pgrep: la imagen no trae procps, y con pgrep el healthcheck de list
      # llevaba semanas en rojo sobre un backup que iba bien.
      test: ["CMD-SHELL", "[ \"$$(cat /proc/1/comm)\" = crond ] && [ -n \"$$(find /backups/.last-backup-ok -mmin -1560 2>/dev/null)\" ]"]
      interval: 5m
      timeout: 10s
      retries: 3
      # margen para el backup inicial que lanza el entrypoint al arrancar
      start_period: 10m

  # CFG-4: los nginx montan SOLO lo que sirven (media y estáticos), no ./data
  # entero: ahí viven también data/secrets/ (token de Gmail, clave de Drive) y
  # data/saml/, que un contenedor expuesto a internet no tiene por qué ver.
  # OJO: las dos subcarpetas tienen que EXISTIR en el host antes del primer
  # `up` (README-DEPLOY §2): si no, Docker las crea como root y el back
  # (appuser) no podría escribir en media/.
  front-gestion:
    build:
      context: .
      dockerfile: front-gestion/Dockerfile
    image: flota-front-gestion:${IMAGE_TAG:-latest}
    restart: unless-stopped
    <<: [*default-security, *caps-nginx]
    deploy: *limits-small
    depends_on:
      back:
        # OPS4: sin esto el front daba 502 mientras el back migraba.
        condition: service_healthy
    logging: *logrotate
    volumes:
      - ${DATA_DIR:-./data}/media:/data/media:ro
      - ${DATA_DIR:-./data}/staticfiles:/data/staticfiles:ro
    networks: [frontend]
    ports:
      # SOLO interna/VPN. Para acceso desde la VPN cambia GESTION_BIND a la IP
      # interna del servidor o a 0.0.0.0; 127.0.0.1 = solo local.
      - "${GESTION_BIND:-127.0.0.1}:${GESTION_PORT:-8093}:80"

  front-conductores:
    build:
      context: .
      dockerfile: front-conductores/Dockerfile
    image: flota-front-conductores:${IMAGE_TAG:-latest}
    restart: unless-stopped
    <<: [*default-security, *caps-nginx]
    deploy: *limits-small
    depends_on:
      back:
        condition: service_healthy
    logging: *logrotate
    volumes:
      # Conductores no sirve /static (el admin de Django no sale a internet).
      - ${DATA_DIR:-./data}/media:/data/media:ro
    networks: [frontend]
    ports:
      # CFG-13: el Cloudflare Tunnel entra por http://localhost:8092 (cloudflared
      # corre en red host), así que el bind DEBE seguir cubriendo el loopback y
      # el valor de producción es 127.0.0.1. Docker publica en UNA sola
      # dirección, no en varias a la vez:
      #   127.0.0.1    -> solo el propio servidor (túnel sí, VPN no).  [por defecto y PROD]
      #   0.0.0.0      -> todas las interfaces: el túnel sigue bien y además llega
      #                   la VPN, pero el puerto queda abierto SIN el TLS ni el
      #                   filtro de Cloudflare delante. Solo para probar.
      #   <IP-interna> -> solo la VPN, y entonces el loopback DEJA de publicarse:
      #                   habría que repuntar cloudflared a http://<IP-interna>:8092.
      - "${CONDUCTORES_BIND:-127.0.0.1}:${CONDUCTORES_PORT:-8092}:80"

networks:
  frontend:
  backend:

volumes:
  # La BD vive en una carpeta del host (bind) y no en un volumen interno de
  # Docker, por dos motivos: puede estar en OTRO disco que la raíz (en srvgcptd,
  # /mnt/data: el proyecto entero se movió allí el 15-sep-2026) y un `down -v`
  # ya no la borra (solo quita el objeto volumen; la carpeta sigue ahí).
  # El nombre real del volumen es flota_flota_pgdata (proyecto `flota` + clave).
  # OJO: un volumen ya creado NO cambia de ruta al editar esto; hay que copiar
  # los datos, `docker volume rm flota_flota_pgdata` y volver a levantar
  # (procedimiento en deploy/README-DEPLOY.md).
  flota_pgdata:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${PGDATA_HOST_DIR:-./pgdata}
