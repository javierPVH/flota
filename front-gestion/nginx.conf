# nginx del contenedor front-gestion: puerta COMPLETA del dominio de gestión,
# variante HTTP (la de por defecto). Sirve en :80 en claro para la VPN.
#
# Todo lo que se sirve —root, cabeceras, proxy /api y /admin al back, /static
# y /media del volumen, el SPA— vive en los dos snippets de nginx/ y es lo
# MISMO que sirve la variante https (nginx.tls.conf): aquí solo se decide cómo
# se escucha. Sin HSTS en esta variante: el `map $scheme $hsts` deja la
# cabecera vacía en http y nginx no la manda.
#
# Para servir gestión por https con el certificado de la CA corporativa, el
# override docker-compose.gestion-tls.yml monta nginx.tls.conf en lugar de
# este fichero (ver deploy/README-DEPLOY.md, «Gestión por HTTPS»).

include /etc/nginx/snippets/gestion-http.conf;

server {
    listen 80;
    server_name _;                    # este puerto sirve SOLO gestión
    include /etc/nginx/snippets/gestion-server.conf;
}
