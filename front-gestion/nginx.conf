# nginx del contenedor front-gestion: puerta COMPLETA del dominio de gestión.
# Sirve el SPA y reenvía la API (/api, /admin) al back por la red interna del
# compose. /static y /media salen del volumen de datos (solo lectura).

# Preserva el esquema original: si viene de Cloudflare (X-Forwarded-Proto=https)
# se respeta; si no (acceso interno http por VPN), se usa el esquema real.
map $http_x_forwarded_proto $flota_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

upstream flota_back { server back:8000; }

server {
    listen 80;
    server_name _;                    # este puerto sirve SOLO gestión
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 20m;         # subida de documentos (FLEET_DOCUMENT_MAX_MB)

    # --- API + admin de Django -> back ---
    location ~ ^/(api|admin)/ {
        proxy_pass http://flota_back;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $flota_proto;
        proxy_set_header X-Forwarded-Host  $host;
    }

    # --- Estáticos de Django (admin/DRF) y media, desde el volumen ---
    location /static/ { alias /data/staticfiles/; access_log off; expires 1y; }
    location /media/  { alias /data/media/; }

    # --- SPA: rutas de react-router que no son ficheros -> index.html ---
    location / {
        try_files $uri $uri/ /index.html;
    }
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }
}
