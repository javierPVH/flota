# nginx del contenedor front-gestion: puerta COMPLETA del dominio de gestión.
# Sirve el SPA y reenvía la API (/api, /admin) al back por la red interna del
# compose. /static y /media salen del volumen de datos (solo lectura).

upstream flota_back { server back:8000; }

server {
    listen 80;
    server_name _;                    # este puerto sirve SOLO gestión
    root /usr/share/nginx/html;
    index index.html;

    # OPS6: alineado con FLEET_DOCUMENT_MAX_MB (10 MB) + margen multipart.
    client_max_body_size 12m;

    # SEC10: cabeceras de seguridad para el SPA y todo lo servido aquí.
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    # A3: sin CSP aquí a propósito — gestión carga Google Picker/GIS
    # (apis.google.com, accounts.google.com, iframes de Drive) y una CSP a
    # ciegas rompería la integración; se protege por VPN + cabeceras de arriba.

    # --- API + admin de Django -> back ---
    location ~ ^/(api|admin)/ {
        proxy_pass http://flota_back;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # SEC6: gestión NO va tras Cloudflare — el esquema es SIEMPRE el real
        # ($scheme). Propagar el del cliente permitía falsear https/rate-limit.
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
    }

    # --- Estáticos de Django (admin/DRF) y media, desde el volumen ---
    location /static/ { alias /data/staticfiles/; access_log off; expires 1y; }
    # SEC3: misma protección que en conductores (sesión + X-Accel-Redirect).
    location /media/ {
        proxy_pass http://flota_back;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
    }
    location /_protected_media/ {
        internal;
        alias /data/media/;
    }

    # --- SPA: rutas de react-router que no son ficheros -> index.html ---
    # A3: el shell NUNCA se cachea — si no, los deploys tardan en llegar a los
    # clientes (index.html viejo apuntando a assets con hash ya purgados).
    location = /index.html {
        add_header Cache-Control "no-cache";
        # A3: un add_header dentro de una location CANCELA los heredados del
        # server — hay que repetir aquí las cabeceras de seguridad.
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }
    location / {
        add_header Cache-Control "no-cache";
        # A3: un add_header dentro de una location CANCELA los heredados del
        # server — hay que repetir aquí las cabeceras de seguridad.
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        try_files $uri $uri/ /index.html;
    }
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        # A3: un add_header dentro de una location CANCELA los heredados del
        # server — hay que repetir aquí las cabeceras de seguridad.
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        try_files $uri =404;
    }

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        # A3: un add_header dentro de una location CANCELA los heredados del
        # server — hay que repetir aquí las cabeceras de seguridad.
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        return 200 "ok\n";
    }
}
