# Snippet de nivel HTTP del nginx de gestión. Lo incluyen las dos variantes
# (nginx.conf = http, nginx.tls.conf = https) ANTES de sus bloques `server`,
# porque `upstream` y `map` solo pueden declararse a este nivel.

upstream flota_back { server back:8000; }

# HSTS solo por https. nginx NO manda una cabecera con valor vacío, así que en
# http el `add_header Strict-Transport-Security $hsts` del server no sale y en
# https sale con el año. Una sola fuente para las dos variantes: no hay que
# tocar la config http para "quitar" HSTS ni la https para ponerlo.
map $scheme $hsts {
    default "";
    https   "max-age=31536000";
}
