# Cuerpo del `server` de gestión: root, cabeceras, proxy al back y locations.
# Lo incluyen las dos variantes (nginx.conf en :80, nginx.tls.conf en :443)
# para que sirvan EXACTAMENTE lo mismo y solo cambie cómo escuchan. Aquí no va
# ningún `listen`, `server_name` ni nada de TLS: eso es de cada variante.
#
# Sirve el SPA y reenvía la API (/api, /admin) al back por la red interna del
# compose. /static y /media salen del volumen de datos (solo lectura).

root /usr/share/nginx/html;
index index.html;

# CFG-10: sin la versión de nginx en `Server:` ni en las páginas de error.
server_tokens off;

# OPS6: alineado con FLEET_DOCUMENT_MAX_MB (10 MB) + margen multipart.
client_max_body_size 12m;

# SEC10: cabeceras de seguridad para el SPA y todo lo servido aquí.
add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options DENY always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
# HSTS solo cuando se sirve por https: `$hsts` sale del `map $scheme` de
# gestion-http.conf y en http es cadena vacía (nginx no manda la cabecera).
add_header Strict-Transport-Security $hsts always;
# FE-4: CSP en modo SOLO INFORME (Report-Only), no bloqueante. Gestión carga
# Google Picker/GIS (apis.google.com, accounts.google.com, iframes de Drive)
# y una CSP a ciegas rompería la integración (A3); así se ve en la consola
# del navegador qué violaría antes de pasarla a Content-Security-Policy.
# Sin report-uri: los informes solo salen en las DevTools.
add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' https://apis.google.com https://accounts.google.com; frame-src https://accounts.google.com https://docs.google.com https://drive.google.com; connect-src 'self' https://www.googleapis.com https://accounts.google.com; img-src 'self' data: blob: https://*.googleusercontent.com https://drive.google.com; style-src 'self' 'unsafe-inline' https://accounts.google.com; font-src 'self' data:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;

# --- Sonda de readiness: NO sale del contenedor del back ---
# /api/ready/ cuenta si la BD y la cache responden; la mira el HEALTHCHECK de
# la imagen (en loopback) y nadie mas. El back ya contesta 404 a lo que no
# venga de loopback; aqui ni se reenvia. El `=` gana al regex de abajo.
location = /api/ready/ { return 404; }

# --- API + admin de Django -> back ---
# Ojo: el panel va APAGADO en el back (DJANGO_ADMIN_ENABLED), asi que
# /admin/ devuelve 404. El location se queda porque es lo que lo hace
# alcanzable el rato que se enciende para conceder un superusuario.
location ~ ^/(api|admin)/ {
    proxy_pass http://flota_back;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    # SEC6: gestión NO va tras Cloudflare — el esquema es SIEMPRE el real
    # ($scheme: http en nginx.conf, https en nginx.tls.conf). Propagar el del
    # cliente permitía falsear https/rate-limit. Django lo lee con
    # SECURE_PROXY_SSL_HEADER (SECURE_BEHIND_PROXY=True) para `is_secure()`.
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;
    # CFG-10: Django también manda estas tres; con el `add_header ... always`
    # del server llegaban duplicadas. Las de nginx son la única fuente.
    proxy_hide_header X-Frame-Options;
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header Referrer-Policy;
    # SRV-5: HSTS también es de nginx (SECURE_HSTS_SECONDS=0 en el back); si
    # alguien lo enciende allí, que no salga dos veces.
    proxy_hide_header Strict-Transport-Security;
}

# --- Estáticos de Django (admin/DRF) y media, desde el volumen ---
location /static/ { alias /data/staticfiles/; access_log off; expires 1y; }
# SEC3: misma protección que en conductores (sesión + X-Accel-Redirect).
location /media/ {
    proxy_pass http://flota_back;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header Referrer-Policy;
    proxy_hide_header Strict-Transport-Security;
}
location /_protected_media/ {
    internal;
    alias /data/media/;
}

# --- SPA: rutas de react-router que no son ficheros -> index.html ---
# A3: el shell NUNCA se cachea — si no, los deploys tardan en llegar a los
# clientes (index.html viejo apuntando a assets con hash ya purgados).
location = /index.html {
    add_header Cache-Control "no-cache";
    # A3: un add_header dentro de una location CANCELA los heredados del
    # server — hay que repetir aquí las cabeceras de seguridad (HSTS incluido).
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security $hsts always;
    add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' https://apis.google.com https://accounts.google.com; frame-src https://accounts.google.com https://docs.google.com https://drive.google.com; connect-src 'self' https://www.googleapis.com https://accounts.google.com; img-src 'self' data: blob: https://*.googleusercontent.com https://drive.google.com; style-src 'self' 'unsafe-inline' https://accounts.google.com; font-src 'self' data:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
}
location / {
    add_header Cache-Control "no-cache";
    # A3: un add_header dentro de una location CANCELA los heredados del
    # server — hay que repetir aquí las cabeceras de seguridad (HSTS incluido).
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security $hsts always;
    add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' https://apis.google.com https://accounts.google.com; frame-src https://accounts.google.com https://docs.google.com https://drive.google.com; connect-src 'self' https://www.googleapis.com https://accounts.google.com; img-src 'self' data: blob: https://*.googleusercontent.com https://drive.google.com; style-src 'self' 'unsafe-inline' https://accounts.google.com; font-src 'self' data:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
    try_files $uri $uri/ /index.html;
}
location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    # A3: un add_header dentro de una location CANCELA los heredados del
    # server — hay que repetir aquí las cabeceras de seguridad (HSTS incluido).
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security $hsts always;
    try_files $uri =404;
}

location = /healthz {
    access_log off;
    add_header Content-Type text/plain;
    # A3: un add_header dentro de una location CANCELA los heredados del
    # server — hay que repetir aquí las cabeceras de seguridad (HSTS incluido).
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security $hsts always;
    return 200 "ok\n";
}
