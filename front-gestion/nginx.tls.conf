# nginx del contenedor front-gestion, variante HTTPS: gestión servida con el
# certificado de la CA corporativa y un nombre del DNS interno (solo VPN).
#
# NO es la config por defecto: la imagen lleva nginx.conf (http). Esta se
# monta encima con el override docker-compose.gestion-tls.yml, que además
# monta la carpeta del certificado (GESTION_TLS_DIR -> /etc/nginx/certs, solo
# lectura) y publica el 443 en la misma IP que el 80. Lo que se sirve es
# EXACTAMENTE lo mismo que en http: los dos snippets de nginx/.
#
# Es una PLANTILLA, no una config: el override la monta en
# /etc/nginx/templates/default.conf.template y el entrypoint de la imagen
# oficial la pasa por envsubst al arrancar (solo las variables GESTION_*,
# por NGINX_ENVSUBST_FILTER: las `$host`, `$scheme`… de nginx se quedan como
# están). La única que se sustituye es ${GESTION_HTTPS_PORT}, y hace falta
# porque dos instancias en la misma IP no pueden publicar las dos el 443:
# la segunda va en otro puerto (8443) y la redirección del :80 tiene que
# llevarlo, o `https://$host/` cae en el 443… que es la OTRA instancia.
#
# Certificado (ver deploy/README-DEPLOY.md, «Gestión por HTTPS»):
#   /etc/nginx/certs/gestion.crt  certificado del servidor + intermedias de la
#                                 CA corporativa, en ese orden y SIN la raíz
#   /etc/nginx/certs/gestion.key  clave privada; root:root y 600. El master de
#                                 nginx la lee como root ANTES de bajar a
#                                 `nginx`, y con cap_drop ALL (CFG-8) root no
#                                 tiene DAC_OVERRIDE: si no es suya y legible,
#                                 el contenedor no arranca.

include /etc/nginx/snippets/gestion-http.conf;

# Sufijo de puerto de la redirección a https: vacío en el 443 (el puerto por
# defecto, que el navegador no enseña) y ":<puerto>" en cualquier otro. La
# fuente del `map` es una constante ya sustituida por envsubst, así que la
# decisión se toma una vez al cargar la config.
map "${GESTION_HTTPS_PORT}" $gestion_https_suffix {
    default ":${GESTION_HTTPS_PORT}";
    "443"   "";
    ""      "";
}

# --- :443 — la aplicación ---------------------------------------------------
server {
    listen 443 ssl;
    http2 on;
    server_name _;                    # este puerto sirve SOLO gestión

    ssl_certificate     /etc/nginx/certs/gestion.crt;
    ssl_certificate_key /etc/nginx/certs/gestion.key;

    # Solo TLS moderno. Con 1.2 y 1.3 los cifrados por defecto de nginx ya son
    # los buenos y en 1.3 ni se eligen: no se fija una lista que caduque.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # Caché de sesión TLS compartida entre workers: la segunda conexión del
    # mismo navegador reanuda sin repetir el handshake entero. 10 MB ≈ 40.000
    # sesiones, de sobra para una app interna. Sin tickets: con ellos la
    # clave de cifrado de tickets vive en memoria del proceso y no rota sola.
    ssl_session_cache shared:gestion_ssl:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    include /etc/nginx/snippets/gestion-server.conf;
}

# --- :80 — solo la sonda del contenedor; todo lo demás, a https --------------
# El HEALTHCHECK del Dockerfile pide http://127.0.0.1/healthz, y el compose
# sigue publicando este puerto (GESTION_PORT): quien entre por la URL http de
# siempre acaba en la https. `$host` no lleva puerto, así que el de https se
# añade a mano ($gestion_https_suffix, arriba): sin él, con GESTION_HTTPS_PORT
# distinto de 443 la redirección caía en el 443 de la otra instancia.
server {
    listen 80;
    server_name _;
    server_tokens off;

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        return 200 "ok\n";
    }

    location / {
        return 301 https://$host$gestion_https_suffix$request_uri;
    }
}
