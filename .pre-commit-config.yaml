# Hooks locales antes del commit. Instalar con:
#   pip install pre-commit && pre-commit install
# La config de ruff vive en back/pyproject.toml.
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.12.12
    hooks:
      - id: ruff
        name: ruff (lint + autofix)
        args: [--fix]
        files: ^back/
      - id: ruff-format
        name: ruff (format)
        files: ^back/

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
      - id: detect-private-key

  # CFG-11: secretos antes de que lleguen a un commit (la CI los busca después
  # en todo el histórico, pero entonces ya hay que rotarlos). Allowlist mínima
  # en .gitleaks.toml. El hook compila gitleaks con Go la primera vez.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
