name: CI

on:
  push:
    branches: [main, master]
  pull_request:

# Cancela ejecuciones anteriores del mismo ref si llega un push nuevo.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: back
    env:
      # Dev-mode: settings usa defaults seguros y no exige SECRET_KEY/ALLOWED_HOSTS.
      DEBUG: "True"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: back/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Ruff (lint)
        run: ruff check .

      - name: Ruff (format check)
        run: ruff format --check .

      - name: Django system check
        run: python manage.py check

      - name: Migrations up to date
        run: python manage.py makemigrations --check --dry-run

      - name: Tests + coverage (falla si baja del umbral)
        run: |
          coverage run manage.py test
          coverage report

      - name: Auditoría de dependencias (informativa)
        continue-on-error: true
        run: pip-audit -r requirements.txt
