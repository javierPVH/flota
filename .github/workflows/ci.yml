name: CI

on:
  push:
    branches: [main, master]
  pull_request:

# Cancela ejecuciones anteriores del mismo ref si llega un push nuevo.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# CFG-9: todas las `uses:` van fijadas por SHA de commit (el tag al lado es
# informativo). Un tag se puede mover; un SHA no. Para actualizar una action:
#   git ls-remote --tags https://github.com/<owner>/<repo>.git refs/tags/vX.Y.Z

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: back
    env:
      # Dev-mode: settings usa defaults seguros y no exige SECRET_KEY/ALLOWED_HOSTS.
      DEBUG: "True"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: back/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Ruff (lint)
        run: ruff check .

      - name: Ruff (format check)
        run: ruff format --check .

      - name: Django system check
        run: python manage.py check

      # B18: la suite corre con DEBUG=True, así que las validaciones de
      # producción (SECRET_KEY, ALLOWED_HOSTS, cookies, HSTS, claves Fernet,
      # auto-alta de Google sin dominios…) no se ejercitaban NUNCA en CI.
      - name: Django deploy check (DEBUG=False)
        env:
          DEBUG: "False"
          SECRET_KEY: ci-only-not-a-real-secret-Ab1${{ github.sha }}
          ALLOWED_HOSTS: flota.example.com
        run: python manage.py check --deploy --fail-level WARNING

      - name: Migrations up to date
        run: python manage.py makemigrations --check --dry-run

      - name: Tests + coverage (falla si baja del umbral)
        run: |
          coverage run manage.py test
          coverage report

      # CFG-7: BLOQUEANTE (antes `continue-on-error: true`, o sea decorativo).
      # Si una vulnerabilidad concreta no aplica o no tiene arreglo aún, se
      # excluye con `--ignore-vuln <ID>` y un comentario que diga por qué y
      # hasta cuándo; nunca volviendo a poner el continue-on-error.
      - name: Auditoría de dependencias (pip-audit)
        run: pip-audit -r requirements.txt

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # CFG-7: solo las dependencias que llegan al bundle (--omit=dev) y a
      # partir de gravedad alta. Bloqueante.
      - name: Auditoría de dependencias (npm audit)
        run: npm audit --omit=dev --audit-level=high

      - name: Build design system (@flota/ui)
        run: npm run build:ui

      - name: Typecheck (apps)
        run: npm run typecheck

      - name: Lint (DS + apps)
        run: npm run lint

      - name: Tests (DS + apps)
        run: npm test

      - name: Build (apps)
        run: npm run build

  deploy-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: docker compose config (valida la composición)
        run: |
          cp .env.example .env
          cp back/.env.prod.example back/.env.prod
          docker compose config -q

  # CFG-7: secretos en el histórico. fetch-depth 0 para que mire TODOS los
  # commits del push/PR y no solo el último. La allowlist está en .gitleaks.toml.
  # En un repositorio de ORGANIZACIÓN la action exige GITLEAKS_LICENSE (clave
  # gratuita en gitleaks.io); en uno personal no hace falta y el secreto puede
  # quedar vacío.
  gitleaks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
