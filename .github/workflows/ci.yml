name: CI

on:
  push:
    branches: [main, master]
  pull_request:

# Cancela ejecuciones anteriores del mismo ref si llega un push nuevo.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: back
    env:
      # Dev-mode: settings usa defaults seguros y no exige SECRET_KEY/ALLOWED_HOSTS.
      DEBUG: "True"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: back/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Ruff (lint)
        run: ruff check .

      - name: Ruff (format check)
        run: ruff format --check .

      - name: Django system check
        run: python manage.py check

      # B18: la suite corre con DEBUG=True, así que las validaciones de
      # producción (SECRET_KEY, ALLOWED_HOSTS, cookies, HSTS, claves Fernet,
      # auto-alta de Google sin dominios…) no se ejercitaban NUNCA en CI.
      - name: Django deploy check (DEBUG=False)
        env:
          DEBUG: "False"
          SECRET_KEY: ci-only-not-a-real-secret-Ab1${{ github.sha }}
          ALLOWED_HOSTS: flota.example.com
        run: python manage.py check --deploy --fail-level WARNING

      - name: Migrations up to date
        run: python manage.py makemigrations --check --dry-run

      - name: Tests + coverage (falla si baja del umbral)
        run: |
          coverage run manage.py test
          coverage report

      - name: Auditoría de dependencias (informativa)
        continue-on-error: true
        run: pip-audit -r requirements.txt

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build design system (@flota/ui)
        run: npm run build:ui

      - name: Typecheck (apps)
        run: npm run typecheck

      - name: Lint (DS + apps)
        run: npm run lint

      - name: Tests (DS + apps)
        run: npm test

      - name: Build (apps)
        run: npm run build

  deploy-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: docker compose config (valida la composición)
        run: |
          cp .env.example .env
          cp back/.env.prod.example back/.env.prod
          docker compose config -q
